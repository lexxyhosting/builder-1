name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download User ZIP
        id: download
        run: |
          echo "📥 Mendownload ZIP..."
          ZIP_URL="${{ github.event.client_payload.zip_url }}"
          
          for i in 1 2 3; do
            echo "Percobaan ke-$i..."
            if curl -L -f --connect-timeout 30 --max-time 120 -o project.zip "$ZIP_URL"; then
              echo "✅ Download berhasil!"
              break
            else
              if [ $i -eq 3 ]; then
                echo "❌ GAGAL: Tidak bisa mendownload ZIP"
                exit 1
              fi
              sleep 10
            fi
          done
          
          FILE_SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
          echo "📦 Ukuran ZIP: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "❌ File ZIP terlalu kecil"
            exit 1
          fi

      - name: Extract & Debug ZIP Structure
        run: |
          echo "📂 Mengekstrak ZIP..."
          mkdir -p app_source
          unzip -o -q project.zip -d app_source
          
          echo ""
          echo "=========================================="
          echo "📋 ANALISIS STRUKTUR ZIP"
          echo "=========================================="
          echo ""
          echo "📁 Root folder contents:"
          ls -la app_source/
          
          echo ""
          echo "📁 Mencari pubspec.yaml..."
          find app_source -name "pubspec.yaml" -type f 2>/dev/null || echo "❌ pubspec.yaml TIDAK DITEMUKAN!"
          
          echo ""
          echo "📁 Mencari file .dart (lib/):"
          find app_source -name "*.dart" -type f 2>/dev/null | head -10 || echo "❌ Tidak ada file .dart!"
          
          echo ""
          echo "📁 Struktur folder (max 3 level):"
          find app_source -maxdepth 3 -type d | sort
          
          echo ""
          echo "📁 Total files:"
          find app_source -type f | wc -l

      - name: Find & Fix Project Structure
        id: find_project
        run: |
          echo "🔍 Menganalisis project..."
          
          # Cari pubspec.yaml
          PUBSPEC_FILE=$(find ./app_source -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          
          if [ -z "$PUBSPEC_FILE" ]; then
            echo ""
            echo "❌ ========================================"
            echo "❌ FATAL: pubspec.yaml TIDAK DITEMUKAN!"
            echo "❌ ========================================"
            echo ""
            echo "💡 Ini adalah penyebab build gagal!"
            echo ""
            echo "📁 Isi ZIP lengkap (semua file):"
            find ./app_source -type f
            echo ""
            echo "🛠 CARA MEMPERBAIKI:"
            echo "1. Buka folder project Flutter di komputer kamu"
            echo "2. Pastikan ada file pubspec.yaml"
            echo "3. Pilih SEMUA file di dalam folder project"
            echo "4. Klik kanan → Compress/ZIP"
            echo "5. JANGAN ZIP folder luarnya!"
            echo ""
            echo "Struktur ZIP yang BENAR:"
            echo "  project.zip"
            echo "  ├── pubspec.yaml  ← harus ada!"
            echo "  ├── lib/"
            echo "  │   └── main.dart"
            echo "  └── android/"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$PUBSPEC_FILE")
          echo "✅ pubspec.yaml ditemukan di: $PUBSPEC_FILE"
          echo "✅ Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          
          echo ""
          echo "📄 Isi pubspec.yaml:"
          cat "$PUBSPEC_FILE"
          
          # Cek struktur project
          echo ""
          echo "📁 Verifikasi struktur project..."
          
          if [ -d "$PROJECT_ROOT/lib" ]; then
            echo "✅ Folder lib/ ADA"
            ls -la "$PROJECT_ROOT/lib/"
          else
            echo "❌ Folder lib/ TIDAK ADA!"
          fi
          
          if [ -d "$PROJECT_ROOT/android" ]; then
            echo "✅ Folder android/ ADA"
          else
            echo "⚠️ Folder android/ tidak ada (akan dibuat saat pub get)"
          fi

      - name: Configure Flutter Project
        run: |
          cd "$PROJECT_ROOT"
          
          echo "⚙️ Konfigurasi Flutter..."
          
          # Buat android folder jika belum ada
          if [ ! -d "android" ]; then
            echo "📝 Membuat Android project..."
            flutter create --platforms android . 2>&1 || echo "Create android project (mungkin sudah ada)"
          fi
          
          # Buat local.properties
          if [ ! -f "android/local.properties" ]; then
            echo "📝 Membuat local.properties..."
            mkdir -p android
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          else
            echo "✅ local.properties sudah ada"
            sed -i "s|sdk.dir=.*|sdk.dir=$ANDROID_HOME|g" android/local.properties 2>/dev/null || true
          fi
          
          echo "📋 Konfigurasi Android:"
          cat android/local.properties 2>/dev/null || echo "Tidak ada local.properties"
          
          # Cek gradle wrapper
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo ""
            echo "📋 Gradle version:"
            grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Flutter Clean & Pub Get
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🧹 Flutter clean..."
          flutter clean 2>&1 || echo "Clean selesai/gagal"
          
          echo ""
          echo "📦 Flutter pub get..."
          flutter pub get 2>&1
          
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ GAGAL PUB GET!"
            echo "💡 Periksa dependencies di pubspec.yaml"
            exit 1
          fi
          
          echo "✅ Pub get berhasil!"
          
          echo ""
          echo "📋 Dependencies:"
          flutter pub deps 2>&1 | head -20 || echo "Tidak bisa menampilkan"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🔨 MEMULAI BUILD APK..."
          echo "=========================================="
          
          # Build dengan verbose output
          if flutter build apk --release --verbose 2>&1 | tee /tmp/build_log; then
            echo ""
            echo "=========================================="
            echo "✅ BUILD BERHASIL!"
            echo "=========================================="
          else
            echo ""
            echo "=========================================="
            echo "❌ BUILD GAGAL!"
            echo "=========================================="
            echo ""
            echo "📋 ERROR LOG (100 baris terakhir):"
            tail -100 /tmp/build_log
            exit 1
          fi

      - name: Locate APK
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🔍 Mencari APK..."
          
          # Debug struktur build
          echo "📁 Struktur build/:"
          find build/ -type d 2>/dev/null | head -20 || echo "❌ Folder build/ TIDAK ADA"
          
          echo ""
          echo "📁 Mencari file .apk:"
          find . -name "*.apk" -type f 2>/dev/null || echo "❌ TIDAK ADA FILE .apk!"
          
          # Cari APK
          APK_FILE=$(find . -path "*/flutter-apk/*.apk" -o -path "*/apk/release/*.apk" -o -name "app-release.apk" 2>/dev/null | head -1)
          
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          
          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "❌ APK TIDAK DITEMUKAN!"
            echo ""
            echo "📁 Debug - semua file dalam build/:"
            find build/ -type f 2>/dev/null | head -50
            exit 1
          fi
          
          echo "✅ APK: $APK_FILE"
          ls -lh "$APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD ID: ${{ github.event.client_payload.build_id }}"
          echo "STATUS: ${{ job.status }}"
          echo "=========================================="
