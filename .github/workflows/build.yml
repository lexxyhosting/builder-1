name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'  # ⚠️ UPDATE KE VERSI TERBARU (Dart SDK 3.6.x)
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download User ZIP
        id: download
        run: |
          echo "📥 Mendownload ZIP..."
          ZIP_URL="${{ github.event.client_payload.zip_url }}"
          
          for i in 1 2 3; do
            echo "Percobaan ke-$i..."
            if curl -L -f --connect-timeout 30 --max-time 120 -o project.zip "$ZIP_URL"; then
              echo "✅ Download berhasil!"
              break
            else
              if [ $i -eq 3 ]; then
                echo "❌ GAGAL: Tidak bisa mendownload ZIP"
                exit 1
              fi
              sleep 10
            fi
          done
          
          FILE_SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
          echo "📦 Ukuran ZIP: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "❌ File ZIP terlalu kecil"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          echo "📂 Mengekstrak ZIP..."
          mkdir -p app_source
          unzip -o -q project.zip -d app_source
          chmod -R 777 app_source
          
          echo "📋 Isi ZIP:"
          ls -la app_source/

      - name: Find Project Root
        id: find_project
        run: |
          echo "🔍 Mencari pubspec.yaml..."
          
          PUBSPEC_FILE=$(find ./app_source -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "❌ pubspec.yaml TIDAK DITEMUKAN!"
            echo "📁 Semua file:"
            find ./app_source -type f | head -30
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$PUBSPEC_FILE")
          echo "✅ Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          
          echo ""
          echo "📄 pubspec.yaml:"
          cat "$PUBSPEC_FILE"

      - name: Fix Permissions & Config
        run: |
          cd "$PROJECT_ROOT"
          
          # Fix permissions
          echo "🔧 Fix permissions..."
          chmod -R 777 . 2>/dev/null || true
          
          # Hapus folder iOS untuk menghindari error (kita build Android only)
          if [ -d "ios" ]; then
            echo "🗑 Menghapus folder ios (tidak diperlukan untuk APK)..."
            rm -rf ios
          fi
          
          # Buat local.properties
          echo "⚙️ Konfigurasi Android SDK..."
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          
          echo "📋 local.properties:"
          cat android/local.properties

      - name: Check Flutter & Dart Version
        run: |
          echo "📋 Flutter version:"
          flutter --version
          
          echo ""
          echo "📋 Dart version:"
          dart --version
          
          cd "$PROJECT_ROOT"
          
          echo ""
          echo "📋 Required SDK version from pubspec.yaml:"
          grep -A 5 "environment:" pubspec.yaml 2>/dev/null || echo "No SDK constraint"

      - name: Update SDK Constraint if Needed
        run: |
          cd "$PROJECT_ROOT"
          
          # Dapatkan Dart SDK version saat ini
          DART_VERSION=$(dart --version 2>&1 | grep -oP '\d+\.\d+\.\d+' | head -1)
          MAJOR_MINOR=$(echo "$DART_VERSION" | cut -d. -f1,2)
          
          echo "Current Dart SDK: $DART_VERSION"
          echo "Major.Minor: $MAJOR_MINOR"
          
          # Update SDK constraint di pubspec.yaml
          if grep -q "sdk:" pubspec.yaml; then
            echo "🔄 Mengupdate SDK constraint..."
            # Ganti sdk constraint menjadi versi yang tersedia
            sed -i "s/sdk: \">=.*\"/sdk: \">=$MAJOR_MINOR.0 <4.0.0\"/g" pubspec.yaml 2>/dev/null || true
            sed -i "s/sdk: \">=.*\"/sdk: \">=$MAJOR_MINOR.0 <4.0.0\"/g" pubspec.yaml 2>/dev/null || true
            echo "✅ SDK constraint updated"
          fi
          
          echo ""
          echo "📄 Updated pubspec.yaml environment:"
          grep -A 3 "environment:" pubspec.yaml 2>/dev/null

      - name: Flutter Pub Get
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🧹 Flutter clean..."
          flutter clean 2>&1 || true
          
          echo ""
          echo "📦 Flutter pub get..."
          if flutter pub get 2>&1; then
            echo "✅ Pub get berhasil!"
          else
            echo ""
            echo "❌ Pub get gagal! Mencoba dengan --no-pub..."
            
            # Coba perbaiki dependencies
            echo "🔄 Mencoba flutter pub upgrade..."
            flutter pub upgrade 2>&1 || true
            
            echo ""
            echo "🔄 Mencoba flutter pub get lagi..."
            if flutter pub get 2>&1; then
              echo "✅ Pub get berhasil setelah upgrade!"
            else
              echo "❌ Pub get tetap gagal"
              echo "💡 Coba cek versi package di pubspec.yaml"
              exit 1
            fi
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🔨 BUILD APK RELEASE..."
          echo "=========================================="
          
          # Build APK
          if flutter build apk --release 2>&1 | tee /tmp/build_log; then
            echo ""
            echo "=========================================="
            echo "✅ BUILD BERHASIL!"
            echo "=========================================="
          else
            echo ""
            echo "=========================================="
            echo "❌ BUILD GAGAL!"
            echo "=========================================="
            echo ""
            echo "📋 Error log (50 baris terakhir):"
            tail -50 /tmp/build_log
            exit 1
          fi

      - name: Find APK
        run: |
          cd "$PROJECT_ROOT"
          
          echo "🔍 Mencari APK..."
          
          # Tampilkan struktur build folder
          echo "📁 Struktur build/:"
          find build/ -type d 2>/dev/null | head -10 || echo "Folder build/ tidak ada"
          
          # Cari APK
          APK_FILE=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK tidak ditemukan!"
            echo "📁 Semua file di build/:"
            find build/ -type f 2>/dev/null | head -30
            exit 1
          fi
          
          echo "✅ APK ditemukan: $APK_FILE"
          ls -lh "$APK_FILE"
          
          # Simpan path
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD RESULT"
          echo "=========================================="
          echo "🆔 Build ID: ${{ github.event.client_payload.build_id }}"
          echo "📦 Status: ${{ job.status }}"
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ BUILD SUKSES - APK siap didownload!"
          else
            echo "❌ BUILD GAGAL - Cek log di atas"
          fi
          echo "=========================================="
