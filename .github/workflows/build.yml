name: Flutter Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Download & Extract User ZIP
        run: |
          curl -L "${{ github.event.client_payload.zip_url }}" -o project.zip
          unzip project.zip -d app_source
          chmod -R 755 app_source
          
      - name: Fix Compatibility Issues
        run: |
          TARGET_DIR=$(dirname $(find ./app_source -name "pubspec.yaml" -print -quit))
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          
          echo "=== Fix pubspec.yaml untuk kompatibilitas ==="
          
          # 1. Fix font_awesome_flutter (penyebab utama error)
          sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^11.0.0/' pubspec.yaml
          
          # 2. Fix package lain yang mungkin bermasalah
          # Update constraint supaya bisa pakai versi terbaru
          sed -i 's/carousel_slider:.*/carousel_slider: ^5.0.0/' pubspec.yaml
          sed -i 's/chewie:.*/chewie: ^1.14.0/' pubspec.yaml
          sed -i 's/flutter_launcher_icons:.*/flutter_launcher_icons: ^0.14.0/' pubspec.yaml
          sed -i 's/video_player:.*/video_player: ^2.11.0/' pubspec.yaml
          sed -i 's/webview_flutter:.*/webview_flutter: ^4.14.0/' pubspec.yaml
          
          echo "=== Isi pubspec.yaml setelah fix ==="
          cat pubspec.yaml
          
          # 3. Clean cache & get packages
          flutter clean
          flutter pub get
          
      - name: Build APK
        run: |
          TARGET_DIR=$(dirname $(find ./app_source -name "pubspec.yaml" -print -quit))
          cd "$TARGET_DIR"
          
          echo "=== Build APK Release ==="
          flutter build apk --release
          
          # Copy hasil
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/final-app.apk"
          
      - name: Upload APK ke Bot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: final-app.apk
