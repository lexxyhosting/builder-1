name: Flutter Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Download & Extract User ZIP
        run: |
          curl -L "${{ github.event.client_payload.zip_url }}" -o project.zip
          unzip project.zip -d app_source
          
      - name: Build APK (Auto-Detect Directory)
        run: |
          # Cari lokasi asli pubspec.yaml
          TARGET_DIR=$(find ./app_source -name "pubspec.yaml" -print -quit)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan di dalam file ZIP!"
            exit 1
          fi
          
          # Ambil folder PARENT (dirname) dari pubspec.yaml
          TARGET_DIR=$(dirname "$TARGET_DIR")
          
          echo "Project Flutter ditemukan di: $TARGET_DIR"
          
          # PAKAI TANDA KUTIP! Ini kuncinya
          cd "$TARGET_DIR"
          
          # Mulai proses kompilasi
          flutter pub get
          flutter build apk --release
          
          # Pindahkan hasil APK ke folder utama
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/final-app.apk"
          
      - name: Upload APK ke Bot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: final-app.apk
