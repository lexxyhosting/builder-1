name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download User ZIP
        id: download
        run: |
          echo "📥 Mendownload ZIP dari Telegram..."
          ZIP_URL="${{ github.event.client_payload.zip_url }}"
          
          # Download dengan retry (max 3x)
          for i in 1 2 3; do
            echo "Percobaan ke-$i..."
            if curl -L -f --connect-timeout 30 --max-time 120 -o project.zip "$ZIP_URL" 2>/tmp/curl_error; then
              echo "✅ Download berhasil!"
              break
            else
              echo "⚠️ Download gagal (percobaan $i)"
              if [ $i -eq 3 ]; then
                echo "❌ GAGAL: Tidak bisa mendownload ZIP setelah 3x percobaan"
                cat /tmp/curl_error
                exit 1
              fi
              sleep 10
            fi
          done
          
          # Cek ukuran file
          FILE_SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
          echo "📦 Ukuran ZIP: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "❌ GAGAL: File ZIP terlalu kecil/kosong"
            exit 1
          fi

      - name: Extract & Analyze ZIP
        id: extract
        run: |
          echo "📂 Mengekstrak ZIP..."
          mkdir -p app_source
          
          # Extract dengan error handling
          if ! unzip -o -q project.zip -d app_source 2>/tmp/unzip_error; then
            echo "❌ GAGAL: File ZIP rusak atau tidak bisa diekstrak"
            cat /tmp/unzip_error
            exit 1
          fi
          
          chmod -R 777 app_source
          
          echo "📋 Isi ZIP:"
          ls -la app_source/
          echo ""
          echo "📁 Struktur folder (max depth 2):"
          find app_source -maxdepth 2 -type d | sort

      - name: Find Flutter Project Root
        id: find_project
        run: |
          echo "🔍 Mencari pubspec.yaml..."
          
          # Cari pubspec.yaml di semua lokasi
          PUBSPEC_FILE=$(find ./app_source -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          
          if [ -z "$PUBSPEC_FILE" ]; then
            echo ""
            echo "❌ ========================================"
            echo "❌ ERROR: pubspec.yaml TIDAK DITEMUKAN!"
            echo "❌ ========================================"
            echo ""
            echo "📁 Semua file dalam ZIP:"
            find ./app_source -type f | head -30
            echo ""
            echo "💡 SOLUSI:"
            echo "1. Pastikan pubspec.yaml ada DI ROOT ZIP"
            echo "2. Jangan ZIP folder luarnya (buka folder project dulu)"
            echo "3. Struktur yang benar:"
            echo "   project.zip"
            echo "   ├── pubspec.yaml  ← HARUS DI SINI"
            echo "   ├── lib/"
            echo "   └── android/"
            exit 1
          fi
          
          # Ambil folder project root (tanpa pubspec.yaml)
          PROJECT_ROOT_DIR=$(dirname "$PUBSPEC_FILE")
          
          echo ""
          echo "✅ pubspec.yaml ditemukan di: $PUBSPEC_FILE"
          echo "✅ Project root: $PROJECT_ROOT_DIR"
          
          # Simpan path ke environment (PAKAI TANDA KUTIP untuk spasi)
          echo "PROJECT_ROOT=$PROJECT_ROOT_DIR" >> $GITHUB_ENV
          
          # Tampilkan isi pubspec.yaml
          echo ""
          echo "📄 Isi pubspec.yaml:"
          cat "$PUBSPEC_FILE"
          
          # Cek folder wajib
          echo ""
          echo "📁 Memeriksa struktur project..."
          
          if [ -d "$PROJECT_ROOT_DIR/lib" ]; then
            echo "✅ Folder lib/ ditemukan"
          else
            echo "⚠️ Folder lib/ TIDAK ditemukan"
          fi
          
          if [ -d "$PROJECT_ROOT_DIR/android" ]; then
            echo "✅ Folder android/ ditemukan"
          else
            echo "⚠️ Folder android/ TIDAK ditemukan"
          fi

      - name: Configure Android SDK
        run: |
          echo "⚙️ Konfigurasi Android SDK..."
          
          # ⚠️ PENTING: Pakai tanda kutip untuk path dengan spasi
          cd "$PROJECT_ROOT"
          
          echo "📂 Current directory: $(pwd)"
          
          # Buat local.properties jika belum ada
          if [ ! -f "android/local.properties" ]; then
            echo "📝 Membuat local.properties..."
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
            echo "✅ local.properties dibuat"
          else
            echo "✅ local.properties sudah ada"
            # Update SDK path
            sed -i "s|sdk.dir=.*|sdk.dir=$ANDROID_HOME|g" android/local.properties 2>/dev/null || true
            echo "✅ SDK path diupdate"
          fi
          
          echo ""
          echo "📋 Isi local.properties:"
          cat android/local.properties
          
          # Update gradle wrapper jika perlu
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo ""
            echo "📋 Gradle wrapper version:"
            grep "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Flutter Clean & Pub Get
        id: flutter_pub
        run: |
          echo "🧹 Membersihkan cache..."
          cd "$PROJECT_ROOT"
          
          # Clean dulu
          flutter clean 2>/dev/null || echo "Clean tidak diperlukan"
          
          echo "📦 Mendownload dependencies..."
          
          # Pub get dengan error handling
          if flutter pub get 2>&1 | tee /tmp/pub_output; then
            echo "✅ Pub get berhasil!"
          else
            echo ""
            echo "❌ ========================================"
            echo "❌ ERROR: Gagal mendownload dependencies!"
            echo "❌ ========================================"
            
            # Cek error umum
            if grep -q "version solving failed" /tmp/pub_output; then
              echo ""
              echo "💡 MASALAH: Konflik versi package"
              echo "   Solusi: Update versi package di pubspec.yaml"
            elif grep -q "connection timed out" /tmp/pub_output; then
              echo ""
              echo "💡 MASALAH: Koneksi timeout"
              echo "   Solusi: Coba build ulang"
            fi
            
            echo ""
            echo "📋 Log lengkap:"
            cat /tmp/pub_output
            exit 1
          fi

      - name: Build APK Release
        id: build_apk
        run: |
          echo "🔨 Memulai kompilasi APK Release..."
          cd "$PROJECT_ROOT"
          
          # Build dengan output ke file log
          if flutter build apk --release 2>&1 | tee /tmp/build_output; then
            echo ""
            echo "✅ ========================================"
            echo "✅ BUILD BERHASIL!"
            echo "✅ ========================================"
          else
            echo ""
            echo "❌ ========================================"
            echo "❌ BUILD GAGAL!"
            echo "❌ ========================================"
            
            # Analisis error
            BUILD_LOG=$(cat /tmp/build_output)
            
            if echo "$BUILD_LOG" | grep -q "Gradle"; then
              echo ""
              echo "💡 MASALAH: Gradle error"
              echo "   Cek versi Gradle di android/gradle/wrapper/gradle-wrapper.properties"
            elif echo "$BUILD_LOG" | grep -q "Android SDK"; then
              echo ""
              echo "💡 MASALAH: Android SDK tidak ditemukan"
              echo "   Hapus file android/local.properties dari ZIP"
            elif echo "$BUILD_LOG" | grep -q "Kotlin"; then
              echo ""
              echo "💡 MASALAH: Versi Kotlin tidak kompatibel"
              echo "   Update ext.kotlin_version di android/build.gradle"
            elif echo "$BUILD_LOG" | grep -qi "memory\|heap"; then
              echo ""
              echo "💡 MASALAH: Kehabisan memory"
              echo "   Project terlalu besar, kurangi asset"
            fi
            
            echo ""
            echo "📋 Log error lengkap (100 baris terakhir):"
            tail -100 /tmp/build_output
            exit 1
          fi

           - name: Find & Verify APK
        id: find_apk
        run: |
          echo "🔍 Mencari file APK..."
          cd "$PROJECT_ROOT"
          
          echo "📁 Mencari di semua folder build/..."
          find build/ -type f -name "*.apk" 2>/dev/null || echo "Tidak ada di build/"
          
          echo ""
          echo "📁 Mencari di seluruh project..."
          find . -type f -name "*.apk" 2>/dev/null || echo "Tidak ada sama sekali"
          
          # Cari APK di lokasi-lokasi umum
          POSSIBLE_PATHS=(
            "build/app/outputs/flutter-apk/app-release.apk"
            "build/app/outputs/apk/release/app-release.apk"
            "build/app/outputs/flutter-apk/app-debug.apk"
            "build/app/outputs/apk/debug/app-debug.apk"
          )
          
          APK_FILE=""
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -f "$path" ]; then
              APK_FILE="$path"
              echo "✅ APK ditemukan di: $APK_FILE"
              break
            fi
          done
          
          # Kalau masih belum ketemu, cari secara recursive
          if [ -z "$APK_FILE" ]; then
            echo "🔍 Mencari recursive..."
            APK_FILE=$(find . -name "app-release.apk" -o -name "app-debug.apk" -o -name "*.apk" 2>/dev/null | head -1)
            
            if [ -n "$APK_FILE" ]; then
              echo "✅ APK ditemukan (recursive): $APK_FILE"
            fi
          fi
          
          # Kalau tetap tidak ketemu
          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "❌ ========================================"
            echo "❌ APK TIDAK DITEMUKAN!"
            echo "❌ ========================================"
            echo ""
            echo "📁 Isi folder build/ (jika ada):"
            find build/ -type d 2>/dev/null | head -20 || echo "Folder build/ tidak ada"
            echo ""
            echo "📁 Semua file dalam project (max 50):"
            find . -type f 2>/dev/null | head -50
            echo ""
            echo "📁 Folder output Flutter:"
            ls -la build/app/outputs/ 2>/dev/null || echo "Tidak ada folder outputs"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Tidak ada folder flutter-apk"
            ls -la build/app/outputs/apk/ 2>/dev/null || echo "Tidak ada folder apk"
            exit 1
          fi
          
          # Info APK
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || echo 0)
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1048576" | bc 2>/dev/null || echo "unknown")
          
          echo ""
          echo "📦 Detail APK:"
          echo "   Path: $APK_FILE"
          echo "   Size: $APK_SIZE bytes ($APK_SIZE_MB MB)"
          
          # Simpan path APK RELATIF dari PROJECT_ROOT
          APK_RELATIVE="${APK_FILE#./}"
          echo "APK_PATH=$APK_RELATIVE" >> $GITHUB_ENV
          echo "✅ APK siap diupload"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.build_id }}
          path: ${{ env.PROJECT_ROOT }}/${{ env.APK_PATH }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "🆔 Build ID: ${{ github.event.client_payload.build_id }}"
          echo "📦 Repo: ${{ github.repository }}"
          echo "🖥️ Runner: ${{ runner.os }}"
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Status: SUKSES"
            echo "📥 Artifact: ${{ github.event.client_payload.build_id }}"
          else
            echo "❌ Status: GAGAL"
            echo "💡 Cek log di atas untuk detail error"
          fi
          echo "=========================================="

      - name: Cleanup (Always)
        if: always()
        run: |
          echo "🧹 Membersihkan file temporary..."
          rm -f project.zip
          rm -rf app_source
          echo "✅ Cleanup selesai"
